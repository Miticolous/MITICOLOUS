<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rev Hunter — Conexão Leve</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#020617;--card:#0f172a;--accent:#22d3ee;--accent-dim:#1e3a5f;--text:#f8fafc;--muted:#94a3b8;--danger:#ef4444;--ok:#22c55e}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  #app{height:100%;display:flex;flex-direction:column}
  header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--card);border-bottom:1px solid #1e293b}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-0.5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  main{flex:1;overflow-y:auto;padding:20px}
  .card{background:var(--card);border:1px solid #1e293b;border-radius:16px;padding:20px;margin-bottom:16px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:14px}
  .row{display:flex;flex-direction:column;gap:10px}
  label{font-size:12px;color:var(--muted)}
  input,select{background:#020617;border:1px solid #334155;border-radius:10px;color:var(--text);padding:10px 12px;font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid #1e293b}
  .switch{position:relative;display:inline-block;width:44px;height:24px}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#334155;border-radius:24px;transition:.2s}
  .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s}
  input:checked+.slider{background:var(--accent)}
  input:checked+.slider:before{transform:translateX(20px)}
  .big-btn{width:100%;height:64px;border-radius:18px;border:none;background:var(--accent);color:#000;font-size:18px;font-weight:700;cursor:pointer;margin-top:8px}
  .big-btn:disabled{opacity:.5;cursor:not-allowed}
  .big-btn.connected{background:var(--ok)}
  .status{font-size:13px;color:var(--muted);margin-top:8px;min-height:20px}
  .servers{max-height:200px;overflow-y:auto;border:1px solid #334155;border-radius:10px;padding:8px}
  .server-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .server-item.selected{border-color:var(--accent);background:#173a4a}
  .server-item:hover{border-color:#334155;background:#0f2a3a}
  .server-name{font-weight:600;font-size:13px}
  .server-flag{width:24px;height:16px;border-radius:3px;background:#334155;flex-shrink:0}
  .latency{margin-left:auto;font-size:11px;color:var(--muted)}
  footer{height:56px;display:flex;align-items:center;padding:0 16px;background:var(--card);border-top:1px solid #1e293b;color:var(--muted);font-size:12px}
  .hidden{display:none}
  .spinner{width:24px;height:24px;border:3px solid #1e293b;border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><div class="dot"></div>REV HUNTER</div>
  <div style="font-size:11px;color:var(--muted)">Leve · Rápido · Seguro</div>
</header>
<main>
  <div class="card">
    <h2>Conexão</h2>
    <div class="row">
      <label>Modo</label>
      <select id="mode">
        <option value="auto">Automático (melhor servidor)</option>
        <option value="manual">Escolher servidor</option>
      </select>
    </div>
    <div id="server-picker" class="servers hidden"></div>
    <div class="toggle">
      <span>Conexão ativa</span>
      <label class="switch"><input type="checkbox" id="vpn-toggle"><div class="slider"></div></label>
    </div>
    <button class="big-btn" id="connect-btn">Conectar</button>
    <div class="status" id="status">Desconectado</div>
    <button class="big-btn" id="export-btn" style="background:#1e293b;color:var(--text);height:48px;font-size:14px;margin-top:10px">Exportar configuração</button>
    <pre id="cfg" class="hidden" style="background:#020617;border:1px solid #334155;border-radius:10px;padding:10px;font-size:11px;overflow-x:auto;margin-top:10px;word-break:break-all;color:var(--text)"></pre>
  </div>
  <div class="card">
    <h2>Servidores disponíveis</h2>
    <div class="servers" id="servers-list"></div>
  </div>

  <div class="card">
    <h2>Adicionar servidor</h2>
    <div class="row">
      <label>Nome</label><input id="f-name" placeholder="Brasil 2">
      <label>Host</label><input id="f-host" placeholder="br2.seudominio.com" autocomplete="off">
      <label>Porta</label><input id="f-port" type="number" value="443">
      <label>Protocolo</label>
      <select id="f-proto">
        <option value="vless">VLESS</option>
        <option value="vmess">VMess</option>
        <option value="trojan">Trojan</option>
        <option value="ss">Shadowsocks</option>
        <option value="ssh">SSH</option>
      </select>
      <label>UUID / Senha</label><input id="f-uuid" placeholder="uuid ou senha" autocomplete="off">
      <label>SNI (opcional)</label><input id="f-sni" placeholder="seudominio.com" autocomplete="off">
      <label>Path WS (opcional)</label><input id="f-path" placeholder="/ws" autocomplete="off">
    </div>
    <button class="big-btn" id="add-btn" style="height:48px;font-size:14px;margin-top:12px">Adicionar</button>
    <div class="status" id="add-status"></div>
  </div>
</main>
<footer>
  <span id="data">0 B / 0 B</span>
  <span style="margin-left:auto">v2.0 · leve</span>
</footer>
</div>
<script src="/app.js"></script>
</body>
</html>
